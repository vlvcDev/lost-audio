[package]
name = "pedal-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "pedal-engine"

[features]
default = ["alsa-backend"]
alsa-backend = ["dep:alsa"]

[dependencies]
alsa = { version = "0.12", optional = true }
nam-bridge = { path = "../nam-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

[[bin]]
name = "pedal-audio-probe"
path = "src/bin/audio_probe.rs"
required-features = ["alsa-backend"]

[[bin]]
name = "pedal-audio-loopback"
path = "src/bin/audio_loopback.rs"
required-features = ["alsa-backend"]

[[bin]]
name = "pedal-dsp-soak"
path = "src/bin/dsp_soak.rs"

[[bin]]
name = "pedal-nam-soak"
path = "src/bin/nam_soak.rs"
